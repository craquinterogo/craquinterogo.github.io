<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">From exposure to a risk decision</title>
  <desc id="desc">Five connected stages define exposure and constraints, measure the downside, challenge diversification, validate forecasts out of sample, and use uncertainty to make risk decisions. Repeat as exposures and conditions change.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b8ad88"/></marker>
  </defs>
  <rect width="900" height="600" rx="16" fill="#1a1a1a"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#e8e8e8">
    <text x="40" y="42" font-size="24" font-weight="700" fill="#d4af37">From exposure to a risk decision</text>
    <text x="40" y="70" font-size="16" fill="#b7b3a8">A useful assessment ends with an action, not just a number</text>
    <g fill="none" stroke="#b8ad88" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M450 158V174"/>
      <path d="M450 253V269"/>
      <path d="M450 348V364"/>
      <path d="M450 443V459"/>
    </g>
    <g stroke-width="2">
      <rect x="75" y="90" width="750" height="68" rx="12" fill="#26303a" stroke="#92b4d6"/>
      <rect x="75" y="185" width="750" height="68" rx="12" fill="#26303a" stroke="#92b4d6"/>
      <rect x="75" y="280" width="750" height="68" rx="12" fill="#362628" stroke="#efaaa4"/>
      <rect x="75" y="375" width="750" height="68" rx="12" fill="#26303a" stroke="#92b4d6"/>
      <rect x="75" y="470" width="750" height="68" rx="12" fill="#25332f" stroke="#92c4b5"/>
    </g>
    <g text-anchor="middle">
      <text x="450" y="118" font-size="21" font-weight="700">Define the exposure</text>
      <text x="450" y="144" font-size="17">Positions, leverage, horizon, valuation currency and constraints</text>
      <text x="450" y="213" font-size="21" font-weight="700">Measure the downside</text>
      <text x="450" y="239" font-size="17">Quantiles, ES, drawdown and tail shape, with clear probability labels</text>
      <text x="450" y="308" font-size="21" font-weight="700">Challenge diversification</text>
      <text x="450" y="334" font-size="17">Shared exposures, joint shocks and simultaneous selling</text>
      <text x="450" y="403" font-size="21" font-weight="700">Validate out of sample</text>
      <text x="450" y="429" font-size="17">Forecast timing, exception frequency, clustering and tail losses</text>
      <text x="450" y="498" font-size="21" font-weight="700">Show uncertainty and decide</text>
      <text x="450" y="524" font-size="17">Compare assumptions, then set limits, buffers, hedges or position sizes</text>
      <text x="450" y="577" font-size="17" fill="#b7b3a8">Revisit the assessment when positions or market conditions change.</text>
    </g>
  </g>
</svg>
