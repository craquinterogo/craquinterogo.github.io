<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Two lenses on portfolio fragility</title>
  <desc id="desc">Statistical scenarios and stress scenarios feed portfolio revaluation to compare losses, tail severity, and liquidity needs. Stress scenarios do not automatically have forecast probabilities. Reverse stress testing works backward from a damaging outcome.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b8ad88"/></marker>
  </defs>
  <rect width="900" height="540" rx="16" fill="#1a1a1a"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#e8e8e8">
    <text x="40" y="42" font-size="24" font-weight="700" fill="#d4af37">Two lenses on portfolio fragility</text>
    <text x="40" y="70" font-size="16" fill="#b7b3a8">Compare model-based estimates with deliberately challenging scenarios</text>
    <rect x="40" y="100" width="390" height="175" rx="12" fill="#26303a" stroke="#92b4d6" stroke-width="2"/>
    <rect x="470" y="100" width="390" height="175" rx="12" fill="#362628" stroke="#efaaa4" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="235" y="136" font-size="22" font-weight="700">Statistical scenarios</text>
      <text x="235" y="169" font-size="18">History and return distributions</text>
      <text x="235" y="198" font-size="18">Volatility dynamics and jumps</text>
      <text x="235" y="227" font-size="18">Extreme tails and dependence</text>
      <text x="235" y="256" font-size="16">What does the fitted model imply?</text>
      <text x="665" y="136" font-size="22" font-weight="700">Stress scenarios</text>
      <text x="665" y="169" font-size="18">Historical or hypothetical shocks</text>
      <text x="665" y="198" font-size="18">Joint moves and funding pressure</text>
      <text x="665" y="227" font-size="18">Reverse stress: start from failure</text>
      <text x="665" y="256" font-size="16">What could the portfolio not withstand?</text>
    </g>
    <g fill="none" stroke="#b8ad88" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M235 277V305H355V327"/>
      <path d="M665 277V305H545V327"/>
      <path d="M450 400V432"/>
    </g>
    <rect x="190" y="338" width="520" height="62" rx="12" fill="#242424" stroke="#b8ad88" stroke-width="2"/>
    <text x="450" y="364" text-anchor="middle" font-size="21" font-weight="700">Revalue the portfolio</text>
    <text x="450" y="387" text-anchor="middle" font-size="16">Include nonlinear exposures and trading constraints</text>
    <rect x="120" y="444" width="660" height="52" rx="12" fill="#25332f" stroke="#92c4b5" stroke-width="2"/>
    <text x="450" y="476" text-anchor="middle" font-size="20" font-weight="700">Compare losses, tail severity and liquidity needs</text>
    <text x="450" y="524" text-anchor="middle" font-size="15" fill="#b7b3a8">Conceptual schematic. Stress scenarios are not automatically probability forecasts.</text>
  </g>
</svg>
