<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">A price jump can bypass intermediate execution levels</title>
  <desc id="desc">A schematic price path jumps down at an event. Open and closed circles distinguish the pre-jump limit and post-jump value. A dashed line marks the gap, not trades at intermediate prices.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#efaaa4"/></marker>
  </defs>
  <rect width="900" height="420" rx="16" fill="#1a1a1a"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#e8e8e8">
    <text x="40" y="42" font-size="24" font-weight="700" fill="#d4af37">5. A discontinuity is not a sequence of small trades</text>
    <text x="40" y="70" font-size="16" fill="#b7b3a8">Illustrative price path, not an event forecast</text>
    <path d="M90 110V325H830" fill="none" stroke="#b8ad88" stroke-width="2"/>
    <text x="90" y="100" font-size="16">Price</text>
    <path d="M115 160C150 160 160 145 185 150S220 171 250 155S288 145 315 153S350 160 380 147S415 145 445 149L475 149" fill="none" stroke="#92b4d6" stroke-width="4"/>
    <path d="M475 275C510 275 520 293 545 282S580 268 615 280S657 286 690 269S740 279 795 263" fill="none" stroke="#92b4d6" stroke-width="4"/>
    <path d="M475 157V264" fill="none" stroke="#efaaa4" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
    <circle cx="475" cy="149" r="6" fill="#1a1a1a" stroke="#92b4d6" stroke-width="3"/>
    <circle cx="475" cy="275" r="6" fill="#92b4d6"/>
    <path d="M90 210H420" stroke="#b8ad88" stroke-width="2" stroke-dasharray="9 6"/>
    <text x="122" y="236" font-size="16">Planned exit level</text>
    <text x="510" y="185" font-size="18" font-weight="700" fill="#efaaa4">Price gap</text>
    <text x="510" y="211" font-size="16">No assumed execution</text>
    <text x="510" y="235" font-size="16">at intermediate prices</text>
    <text x="475" y="351" text-anchor="middle" font-size="17">Event time</text>
    <text x="790" y="351" font-size="16">Time</text>
    <text x="450" y="391" text-anchor="middle" font-size="17">A stop order does not guarantee its trigger price.</text>
  </g>
</svg>
