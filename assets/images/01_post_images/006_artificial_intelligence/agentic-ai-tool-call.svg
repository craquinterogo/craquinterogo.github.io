<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">A tool call moves through an execution layer</title>
  <desc id="desc">Time runs downward. The model proposes a tool name and arguments. The harness validates the request and checks authorization before invoking the tool or service. A result or explicit error returns through the harness to the model. A denial must prevent execution.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b8ad88"/></marker>
  </defs>
  <rect width="900" height="560" rx="16" fill="#1a1a1a"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#e8e8e8">
    <text x="40" y="42" font-size="24" font-weight="700" fill="#d4af37">The model requests. Software executes.</text>
    <text x="40" y="70" font-size="16" fill="#b7b3a8">A simplified tool interaction, with time running downward</text>
    <rect x="60" y="100" width="180" height="52" rx="10" fill="#332e20" stroke="#d4af37" stroke-width="2"/>
    <rect x="360" y="100" width="180" height="52" rx="10" fill="#26303a" stroke="#92b4d6" stroke-width="2"/>
    <rect x="660" y="100" width="180" height="52" rx="10" fill="#25332f" stroke="#92c4b5" stroke-width="2"/>
    <g text-anchor="middle" font-size="21" font-weight="700">
      <text x="150" y="133">Model</text>
      <text x="450" y="133">Harness</text>
      <text x="750" y="133">Tool / service</text>
    </g>
    <g stroke="#817d72" stroke-width="1.5" stroke-dasharray="6 6">
      <path d="M150 154V476"/>
      <path d="M450 154V476"/>
      <path d="M750 154V476"/>
    </g>
    <g fill="none" stroke="#b8ad88" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M150 200H438"/>
      <path d="M450 310H738"/>
      <path d="M750 385H462"/>
      <path d="M450 450H162"/>
    </g>
    <rect x="345" y="225" width="210" height="47" rx="8" fill="#26303a" stroke="#92b4d6" stroke-width="1.5"/>
    <g text-anchor="middle" font-size="17">
      <text x="300" y="186">Tool name + arguments</text>
      <text x="450" y="254" font-weight="700">Validate and authorize</text>
      <text x="600" y="296">Authorized invocation</text>
      <text x="600" y="371">Result or explicit error</text>
      <text x="300" y="436">Observation in context</text>
    </g>
    <rect x="60" y="498" width="780" height="40" rx="10" fill="#362628"/>
    <text x="450" y="524" text-anchor="middle" font-size="18" font-weight="700" fill="#efaaa4">Permission denied? Return the denial. Do not execute.</text>
  </g>
</svg>
