<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">The harness coordinates the model, context, and tools</title>
  <desc id="desc">A logical harness boundary contains model integration, context and saved state, a run controller, and tool adapters. Bidirectional connections represent coordination and results. Tool adapters connect to external systems. The model and storage may be deployed separately.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b8ad88"/></marker>
  </defs>
  <rect width="900" height="600" rx="16" fill="#1a1a1a"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#e8e8e8">
    <text x="40" y="42" font-size="24" font-weight="700" fill="#d4af37">The harness: coordination, not extra model weights</text>
    <text x="40" y="70" font-size="16" fill="#b7b3a8">Logical responsibilities, not physical hosting locations or an execution sequence</text>
    <rect x="40" y="100" width="820" height="340" rx="16" fill="#242424" stroke="#d4af37" stroke-width="2"/>
    <text x="65" y="130" font-size="20" font-weight="700" fill="#d4af37">Application harness</text>
    <rect x="330" y="150" width="240" height="78" rx="12" fill="#332e20" stroke="#d4af37" stroke-width="2"/>
    <rect x="65" y="300" width="230" height="85" rx="12" fill="#26303a" stroke="#92b4d6" stroke-width="2"/>
    <rect x="335" y="300" width="230" height="85" rx="12" fill="#25332f" stroke="#92c4b5" stroke-width="2"/>
    <rect x="605" y="300" width="230" height="85" rx="12" fill="#26303a" stroke="#92b4d6" stroke-width="2"/>
    <g fill="none" stroke="#b8ad88" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)">
      <path d="M450 240V288"/>
      <path d="M307 342H323"/>
      <path d="M577 342H593"/>
      <path d="M720 397V473"/>
    </g>
    <g text-anchor="middle">
      <text x="450" y="181" font-size="21" font-weight="700">Model integration</text>
      <text x="450" y="208" font-size="17">Call a local or hosted LLM</text>
      <text x="180" y="331" font-size="20" font-weight="700">Context and state</text>
      <text x="180" y="359" font-size="16">Instructions, records, progress</text>
      <text x="450" y="331" font-size="20" font-weight="700">Run controller</text>
      <text x="450" y="359" font-size="16">Permissions, budgets, stopping</text>
      <text x="720" y="331" font-size="20" font-weight="700">Tool adapters</text>
      <text x="720" y="359" font-size="16">Validate, dispatch, return status</text>
      <text x="450" y="418" font-size="17">Enforce configured policies and record what happens.</text>
    </g>
    <rect x="590" y="485" width="260" height="72" rx="12" fill="#242424" stroke="#b8ad88" stroke-width="2"/>
    <text x="720" y="514" text-anchor="middle" font-size="20" font-weight="700">External capabilities</text>
    <text x="720" y="541" text-anchor="middle" font-size="17">Files, databases, APIs</text>
    <text x="65" y="505" font-size="18" font-weight="700">Tools extend what the system can do.</text>
    <text x="65" y="535" font-size="17">The harness controls how it may use them.</text>
    <text x="450" y="583" text-anchor="middle" font-size="15" fill="#b7b3a8">Backend authorization remains necessary. Drawing a boundary does not enforce it.</text>
  </g>
</svg>
