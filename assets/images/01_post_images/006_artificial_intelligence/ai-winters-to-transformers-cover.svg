<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The thaw of an artificial winter</title>
  <desc id="desc">A frozen mountain landscape opens into a warm dawn, where a luminous branching intelligence grows above a dark silicon monolith.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2=".65">
      <stop stop-color="#080e26"/><stop offset=".4" stop-color="#22334d"/><stop offset=".74" stop-color="#755366"/><stop offset="1" stop-color="#edb27f"/>
    </linearGradient>
    <radialGradient id="dawn">
      <stop stop-color="#fff2c7" stop-opacity=".95"/><stop offset=".3" stop-color="#ffb978" stop-opacity=".5"/><stop offset="1" stop-color="#d28291" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snow" x2=".8" y2="1">
      <stop stop-color="#c7e6f2"/><stop offset=".45" stop-color="#577b9e"/><stop offset="1" stop-color="#182b48"/>
    </linearGradient>
    <linearGradient id="river" x2="0" y2="1">
      <stop stop-color="#fff0bd"/><stop offset=".4" stop-color="#dc9789"/><stop offset="1" stop-color="#729ec0"/>
    </linearGradient>
    <linearGradient id="stone" x2="1" y2=".4">
      <stop stop-color="#0a142b"/><stop offset=".6" stop-color="#253148"/><stop offset="1" stop-color="#7f6171"/>
    </linearGradient>
    <linearGradient id="branches" x2=".7" y2="1">
      <stop stop-color="#c6edf1"/><stop offset=".6" stop-color="#ffe2ad"/><stop offset="1" stop-color="#df957f"/>
    </linearGradient>
    <filter id="bloom" x="-.5" y="-.5" width="2" height="2">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="mist"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="12"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".08"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <g id="tree" fill="none" stroke="url(#branches)" stroke-linecap="round">
      <path d="M822 415C820 363 812 329 819 286C825 252 839 230 830 191" stroke-width="5"/>
