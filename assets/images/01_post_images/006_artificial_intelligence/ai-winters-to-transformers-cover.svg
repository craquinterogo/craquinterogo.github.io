      <circle cx="786" cy="191" r="3"/><circle cx="727" cy="156" r="2.5"/>
      <circle cx="811" cy="133" r="3"/><circle cx="837" cy="114" r="2"/>
      <circle cx="862" cy="169" r="3"/><circle cx="892" cy="149" r="2"/>
      <circle cx="934" cy="182" r="3"/><circle cx="953" cy="158" r="2"/>
      <circle cx="960" cy="213" r="3"/><circle cx="947" cy="244" r="2"/>
      <circle cx="961" cy="268" r="3"/><circle cx="949" cy="318" r="3"/>
      <circle cx="920" cy="361" r="2"/><circle cx="703" cy="285" r="2.5"/>
      <circle cx="718" cy="326" r="2"/><circle cx="780" cy="151" r="2"/>
      <circle cx="693" cy="256" r="2"/><circle cx="770" cy="164" r="2"/>
