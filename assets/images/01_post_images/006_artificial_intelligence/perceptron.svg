<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title description">
  <title id="title">How a simple perceptron makes a decision</title>
  <desc id="description">Three inputs, x1, x2, and x3, are multiplied by learned weights w1, w2, and w3. Their weighted sum plus a bias b gives z. A threshold function outputs y equal to 1 when z is greater than or equal to zero, and 0 otherwise.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d4af37"/>
    </marker>
  </defs>
  <rect width="1000" height="560" rx="8" fill="#242424"/>
  <g font-family="system-ui, sans-serif">
    <text x="36" y="48" fill="#e8e8e8" font-size="27" font-weight="600">A simple perceptron</text>
    <text x="36" y="78" fill="#bcbcbc" font-size="18">Combine weighted inputs, add a bias, then apply a threshold</text>
    <g fill="none" stroke="#d4af37" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M180 160 L435 250"/>
      <path d="M180 280 L432 280"/>
      <path d="M180 400 L435 310"/>
      <path d="M490 156 L490 222"/>
      <path d="M548 280 L640 280"/>
      <path d="M800 280 L875 280"/>
    </g>
    <g fill="#393222" stroke="#d4af37" stroke-width="2">
      <circle cx="145" cy="160" r="35"/>
      <circle cx="145" cy="280" r="35"/>
      <circle cx="145" cy="400" r="35"/>
      <circle cx="490" cy="280" r="58"/>
      <rect x="640" y="220" width="160" height="120" rx="8"/>
      <circle cx="910" cy="280" r="35"/>
    </g>
    <g fill="#e8e8e8" text-anchor="middle">
      <g font-size="25" font-weight="600">
        <text x="145" y="168">x1</text>
        <text x="145" y="288">x2</text>
        <text x="145" y="408">x3</text>
        <text x="910" y="288">y</text>
      </g>
      <text x="490" y="296" font-size="48">&#931;</text>
      <g font-size="22">
        <text x="300" y="180">w1</text>
        <text x="300" y="264">w2</text>
        <text x="300" y="390">w3</text>
        <text x="490" y="143">Bias b</text>
        <text x="594" y="264">z</text>
        <text x="720" y="210" font-weight="600">Threshold</text>
        <text x="720" y="266">1 if z &#8805; 0</text>
        <text x="720" y="308">0 otherwise</text>
      </g>
      <g font-size="18" fill="#bcbcbc">
        <text x="145" y="462">Inputs</text>
        <text x="300" y="462">Learned weights</text>
        <text x="490" y="368">Weighted sum</text>
        <text x="910" y="352">Output</text>
      </g>
      <text x="500" y="508" font-size="23">z = w1 x1 + w2 x2 + w3 x3 + b</text>
      <text x="500" y="540" fill="#bcbcbc" font-size="17">Training adjusts the weights and bias; the threshold produces a binary decision.</text>
    </g>
  </g>
</svg>
